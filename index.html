<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mansi Bhalothia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <!-- The wrapper keeps the text and icons perfectly aligned with your image -->
        <div class="image-wrapper">
            <img src="girl.png" alt="Anime Girl" class="main-image">
            
            <div class="name-text">Mansi Bhalothia</div>
            
            <!-- This container handles the circular orbit path -->
            <div class="orbit-container">
                <!-- The actual LinkedIn icon -->
                <a href="https://www.linkedin.com/in/mansi-b-3b4649180/" target="_blank" class="linkedin-orb">in</a>
            </div>
        </div>
    </div>

    <!-- Hidden audio element for the jazz music -->
    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
